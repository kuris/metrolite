<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>서율 메트로 라이트 - 지하철 전기 복구 퍼즐</title>
<style>
  /* ===================== 기본 리셋 ===================== */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none;
  }

  /* ===================== 색상 변수 ===================== */
  :root{
    /* "신비한 터널을 질주하는 하이퍼 기차" 컨셉: 거의 검은 심해 네이비 바탕 + 또렷하게 튀는 전기 시안 하이라이트.
       차분한 파스텔이 아니라, 어두움과 밝음의 대비를 크게 둬서 연결되는 순간 "팟!" 하고 터지는 타격감을 만든다. */
    --bg-deep1:#05060f;
    --bg-deep2:#0a0e24;
    --bg-deep3:#121a3a;
    --purple-dim:#2a3150;
    --purple-dim-light:#3a4470;
    --mint:#4df0ff;
    --mint-soft:rgba(77,240,255,0.9);
    --cyan:#7affd1;
    --gold:#ffe066;
    --text-light:#eef4ff;
    --text-dim:#8893b8;
    --bg-halo:rgba(77,170,220,0.3);
  }

  /* ===================== 전체 배경 (PC에서도 모바일 화면처럼) ===================== */
  body{
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
    background: radial-gradient(circle at 20% 0%, var(--bg-halo), transparent 55%),
                radial-gradient(circle at 85% 90%, rgba(77,240,255,0.1), transparent 50%),
                linear-gradient(160deg, var(--bg-deep1), var(--bg-deep2) 55%, var(--bg-deep3));
  }

  /* 모바일 게임 화면처럼 보이게 하는 중앙 프레임 */
  .phone-frame{
    width: 100%;
    max-width: 420px;
    min-height: 760px;
    max-height: 880px;
    border-radius: 34px;
    overflow: hidden;
    position: relative;
    box-shadow:
      0 0 0 2px rgba(255,255,255,0.05) inset,
      0 0 40px rgba(77,170,220,0.22),
      0 30px 70px rgba(0,0,0,0.65);
    background: linear-gradient(180deg, #06081a 0%, #0a1024 45%, #060814 100%);
    display: flex;
    flex-direction: column;
  }
  @media (max-height: 780px){
    .phone-frame{ min-height: 94vh; max-height: 96vh; }
  }
  @media (max-width: 420px){
    .phone-frame{ border-radius: 0px; min-height: 100vh; max-height: 100vh; }
    body{ padding: 0; }
  }

  /* 사운드 설정 영역 (화면 우상단에 고정) */
  .sound-panel-wrap{
    position: absolute;
    top: 14px;
    right: 14px;
    z-index: 20;
  }
  .sound-toggle-btn{
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.07);
    color: var(--text-light);
    font-size: 1.05rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.2s ease;
  }
  .sound-toggle-btn:active{ transform: scale(0.88); }
  .sound-toggle-btn.muted{ color: var(--text-dim); }

  /* 효과음 / 배경음악을 각각 조절하는 드롭다운 패널 */
  .sound-panel{
    position: absolute;
    top: 48px;
    right: 0;
    width: 196px;
    background: linear-gradient(160deg, #1c1140, #130a30);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 14px 14px 10px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.03) inset;
  }
  .sound-row{
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .sound-row:last-child{ margin-bottom: 0; }
  .sound-row-label{
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }
  .sound-row-title{
    font-size: 0.68rem;
    color: var(--text-dim);
    letter-spacing: 0.3px;
  }
  .sound-mute-btn{
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
    color: var(--text-light);
    font-size: 0.78rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .sound-mute-btn.muted{ color: var(--text-dim); }
  .sound-slider{
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 999px;
    background: rgba(255,255,255,0.15);
    outline: none;
  }
  .sound-slider::-webkit-slider-thumb{
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--mint), var(--cyan));
    box-shadow: 0 0 6px rgba(77,240,255,0.8);
    cursor: pointer;
  }
  .sound-slider::-moz-range-thumb{
    width: 16px; height: 16px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--mint), var(--cyan));
    box-shadow: 0 0 6px rgba(77,240,255,0.8);
    cursor: pointer;
  }

  .game-screen{
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px 18px 0;
    overflow: hidden;
  }

  /* ===================== 헤더 ===================== */
  .game-header{ text-align: center; flex-shrink: 0; }
  .game-title{
    margin: 0;
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--text-light);
    text-shadow: 0 0 8px rgba(77,240,255,0.7), 0 0 20px rgba(60,150,220,0.6);
  }
  .game-subtitle{
    margin: 4px 0 12px;
    font-size: 0.72rem;
    color: var(--text-dim);
    letter-spacing: 0.5px;
  }
  .stage-info{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 6px 16px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  .stage-badge{
    font-size: 0.68rem;
    color: var(--bg-deep1);
    background: linear-gradient(135deg, var(--mint), var(--cyan));
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 700;
  }
  .stage-name{
    margin: 0;
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--mint);
    text-shadow: 0 0 10px rgba(77,240,255,0.5);
  }

  /* ===================== 메인(퍼즐판) ===================== */
  .game-main{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 14px;
    min-height: 0;
  }

  .board-wrap{
    position: relative;
    width: 100%;
    max-width: 340px;
    margin: 0 auto;
  }

  .board{
    display: grid;
    gap: 6px;
    width: 100%;
    aspect-ratio: 1 / 1;
    padding: 10px;
    border-radius: 22px;
    background: linear-gradient(145deg, rgba(255,255,255,0.03), rgba(0,0,0,0.25));
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: 0 0 30px rgba(6,10,28,0.5) inset;
  }

  .cell-empty{ background: transparent; }

  /* 타일 하나: 카드 느낌을 걷어내고, 선로(파이프) 자체가 보이는 미니멀한 칸으로 */
  .tile{
    position: relative;
    border-radius: 16%;
    background: transparent;
    border: none;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.25s ease;
    overflow: visible; /* 연결 순간의 이펙트가 타일 밖으로 살짝 퍼질 수 있게 */
  }
  .tile:active{ transform: scale(0.92); }
  .tile.role-power{ box-shadow: inset 0 0 0 1px rgba(255,224,102,0.22); }
  .tile.role-station{ box-shadow: inset 0 0 0 1px rgba(77,240,255,0.16); }
  .tile.role-station.lit{
    box-shadow: inset 0 0 0 1px var(--mint), 0 0 14px rgba(77,240,255,0.55);
  }
  .tile.cleared{ cursor: default; }

  /* 선로(트랙) 래퍼 - 이 부분만 회전해서 "회전" 애니메이션 표현 */
  .tile-track{
    position: absolute;
    inset: 0;
    transition: transform 0.22s cubic-bezier(.4,1.8,.5,1);
    transform-origin: 50% 50%;
  }

  /* 선로 파이프: 두껍고 둥근 튜브 모양 (기본 = 어두운 미연결 상태) */
  .bar{
    position: absolute;
    background: var(--purple-dim);
    border-radius: 999px;
    transition: background 0.25s ease, box-shadow 0.25s ease;
  }
  .bar-N{ top: 0; left: 50%; width: 36%; height: 58%; transform: translateX(-50%); }
  .bar-S{ bottom: 0; left: 50%; width: 36%; height: 58%; transform: translateX(-50%); }
  .bar-E{ top: 50%; right: 0; height: 36%; width: 58%; transform: translateY(-50%); }
  .bar-W{ top: 50%; left: 0; height: 36%; width: 58%; transform: translateY(-50%); }
  /* 대각선 선로: N 파이프(위쪽 끝=타일 중심 근처)와 동일한 모양을 중심(바닥 끝)을 축으로
     45도 단위로 돌려서 NE/SE/SW/NW 네 방향을 모두 만든다 (N=0deg 기준 시계방향 45도씩) */
  .bar-NE, .bar-SE, .bar-SW, .bar-NW{
    top: 0; left: 50%; width: 36%; height: 58%;
    margin-left: -18%; /* width의 절반만큼 왼쪽으로 밀어 가로 중앙 정렬 (translateX 대신 margin 사용해 회전과 충돌 방지) */
    transform-origin: 50% 100%; /* 회전축 = 파이프의 바닥 끝(타일 중심 부근) */
  }
  .bar-NE{ transform: rotate(45deg); }
  .bar-SE{ transform: rotate(135deg); }
  .bar-SW{ transform: rotate(225deg); }
  .bar-NW{ transform: rotate(315deg); }

  /* 모든 파이프의 끝이 이 허브 밑에서 만나 하나로 이어진 것처럼 보이게, 넉넉하게 키운 중심 원 */
  .tile-center{
    position: absolute;
    top: 50%; left: 50%;
    width: 46%; height: 46%;
    border-radius: 50%;
    background: var(--purple-dim);
    transform: translate(-50%,-50%);
    transition: background 0.25s ease, box-shadow 0.25s ease;
  }

  /* 전력이 흐르는 상태 (연결됨) → 또렷한 전기 시안으로 확 밝아짐 (타격감 있게 대비를 크게) */
  .tile.energized .bar{
    background: linear-gradient(90deg, var(--mint), var(--cyan));
    box-shadow: 0 0 10px rgba(77,240,255,0.95), 0 0 22px rgba(77,240,255,0.4);
  }
  .tile.energized .tile-center{
    background: linear-gradient(135deg, var(--mint), var(--cyan));
    box-shadow: 0 0 12px rgba(77,240,255,1), 0 0 26px rgba(77,240,255,0.45);
  }

  /* 아이콘 레이어 (회전하지 않고 항상 바로 서 있음) */
  .tile-icon{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .icon-power{
    font-size: 1.3rem;
    color: var(--gold);
    text-shadow: 0 0 10px rgba(255,224,102,0.9);
    animation: powerPulse 1.6s ease-in-out infinite;
  }
  @keyframes powerPulse{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.12); }
  }

  .station-dot{
    width: 34%; height: 34%;
    border-radius: 50%;
    border: 2.5px solid var(--purple-dim-light);
    background: rgba(40,52,90,0.6);
    display: block;
    transition: all 0.25s ease;
  }
  .tile.role-station.lit .station-dot{
    border-color: var(--mint);
    background: radial-gradient(circle, #fff, var(--mint) 60%);
    box-shadow: 0 0 12px rgba(77,240,255,1);
  }
  .tile.role-station.pop .station-dot{
    animation: stationPop 0.5s ease;
  }
  @keyframes stationPop{
    0%{ transform: scale(1); }
    40%{ transform: scale(1.5); }
    100%{ transform: scale(1); }
  }

  /* ===================== 연결되는 순간의 이펙트 ===================== */
  /* 어떤 타일이든 처음으로 전기가 들어오면, 타일 전체에 번쩍이는 플래시가 퍼진다 */
  .tile.spark-flash::after{
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 16%;
    background: radial-gradient(circle, rgba(255,255,255,0.95), rgba(77,240,255,0.6) 45%, transparent 75%);
    animation: sparkFlash 0.42s cubic-bezier(.2,.9,.3,1) forwards;
    pointer-events: none;
    z-index: 4;
  }
  @keyframes sparkFlash{
    0%{ opacity: 1; transform: scale(0.3); }
    40%{ opacity: 1; transform: scale(1.2); }
    100%{ opacity: 0; transform: scale(1.55); }
  }

  /* 역이 복구되는 순간: 중심에서 사방으로 터지는 링 + 스파크 파티클 - 짜릿한 타격감을 위해 빠르고 크게 */
  .connect-burst{
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    pointer-events: none;
    z-index: 6;
  }
  .connect-burst .burst-ring{
    position: absolute;
    top: 0; left: 0;
    width: 10px; height: 10px;
    margin: -5px 0 0 -5px;
    border: 2.5px solid var(--mint);
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(77,240,255,0.95);
    animation: burstRing 0.45s cubic-bezier(.15,.85,.3,1) forwards;
  }
  @keyframes burstRing{
    0%{ width: 10px; height: 10px; margin: -5px 0 0 -5px; opacity: 1; }
    100%{ width: 86px; height: 86px; margin: -43px 0 0 -43px; opacity: 0; }
  }
  .connect-burst .burst-spark{
    position: absolute;
    top: 0; left: 0;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 6px rgba(255,255,255,0.95), 0 0 10px rgba(77,240,255,0.85);
    animation: burstSpark 0.42s cubic-bezier(.15,.85,.3,1) forwards;
  }
  @keyframes burstSpark{
    0%{ transform: translate(0, 0) scale(1); opacity: 1; }
    100%{ transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }

  /* 클리어 시 실제 복구된 노선을 따라 움직이는 작은 기차 */
  /* 위치는 JS에서 실제 선로 좌표를 계산해 Web Animations API로 제어함 */
  .train-sprite{
    position: absolute;
    top: 0;
    left: 0;
    font-size: 1.5rem;
    opacity: 0;
    pointer-events: none;
    filter: drop-shadow(0 0 8px rgba(77,240,255,0.9));
    transition: opacity 0.3s ease;
    z-index: 5;
    will-change: transform;
  }
  .train-sprite.run{ opacity: 1; }

  /* ===================== 상태 메시지 ===================== */
  .status-message{
    margin: 2px 0 0;
    text-align: center;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--text-light);
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 999px;
    padding: 8px 16px;
    min-width: 60%;
  }

  /* ===================== 버튼 영역 ===================== */
  .action-area{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 100%;
  }
  .btn{
    width: 80%;
    max-width: 280px;
    min-height: 48px;
    border: none;
    border-radius: 999px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s ease, box-shadow 0.2s ease;
  }
  .btn:active{ transform: scale(0.96); }
  .next-btn{
    background: linear-gradient(135deg, var(--mint), var(--cyan));
    color: #05060f;
    box-shadow: 0 0 18px rgba(77,240,255,0.6);
  }
  .restart-btn{
    background: rgba(255,255,255,0.06);
    color: var(--text-light);
    border: 1px solid rgba(255,255,255,0.15);
  }
  .hidden{ display: none !important; }

  .all-clear-banner{
    text-align: center;
    font-size: 1rem;
    font-weight: 800;
    color: var(--gold);
    text-shadow: 0 0 14px rgba(255,224,102,0.8);
    animation: bannerGlow 1.4s ease-in-out infinite;
  }
  @keyframes bannerGlow{
    0%,100%{ opacity: 0.85; }
    50%{ opacity: 1; }
  }

  /* ===================== 모드(난이도) 선택 오버레이 ===================== */
  .mode-select-overlay{
    position: absolute;
    inset: 0;
    z-index: 30;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 32px 24px;
    background: radial-gradient(circle at 50% 20%, rgba(60,150,220,0.35), transparent 60%),
                linear-gradient(180deg, rgba(10,6,32,0.97), rgba(19,10,48,0.97));
    text-align: center;
  }
  .mode-select-title{
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--text-light);
    margin: 0;
  }
  .mode-select-subtitle{
    font-size: 0.82rem;
    color: var(--text-dim);
    margin: -6px 0 10px;
  }
  .mode-card{
    width: 100%;
    max-width: 300px;
    border-radius: 20px;
    padding: 16px 18px;
    text-align: left;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.04);
    color: inherit;
    font-family: inherit;
    transition: transform 0.12s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .mode-card:active{ transform: scale(0.97); }
  .mode-card-title{
    font-size: 0.98rem;
    font-weight: 700;
    color: var(--text-light);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .mode-card-desc{
    font-size: 0.76rem;
    color: var(--text-dim);
    margin-top: 4px;
    line-height: 1.4;
  }
  .mode-card.easy{ border-color: rgba(60,150,220,0.4); }
  .mode-card.easy:active{ border-color: var(--cyan); box-shadow: 0 0 16px rgba(99,232,255,0.25); }
  .mode-card.hard{ border-color: rgba(255,224,102,0.35); }
  .mode-card.hard:active{ border-color: var(--gold); box-shadow: 0 0 16px rgba(255,224,102,0.25); }
  .mode-card-badge{
    display: inline-block;
    font-size: 0.68rem;
    padding: 2px 8px;
    border-radius: 999px;
    margin-left: auto;
  }
  .mode-card.easy .mode-card-badge{ background: rgba(99,232,255,0.15); color: var(--cyan); }
  .mode-card.hard .mode-card-badge{ background: rgba(255,224,102,0.15); color: var(--gold); }

  /* ===================== 하단 여백 (버튼과 화면 끝 사이, 오클릭 방지) ===================== */
  .ad-spacer{ height: 34px; flex-shrink: 0; }
</style>
</head>
<body>

<div class="phone-frame">
  <!-- 사운드 설정: 버튼을 누르면 효과음/배경음악을 각각 조절하는 패널이 펼쳐짐 -->
  <div class="sound-panel-wrap">
    <button class="sound-toggle-btn" id="soundToggleBtn" aria-label="사운드 설정 열기">🔊</button>
    <div class="sound-panel hidden" id="soundPanel">
      <div class="sound-row">
        <button class="sound-mute-btn" id="sfxMuteBtn" aria-label="효과음 켜기/끄기">🔔</button>
        <div class="sound-row-label">
          <span class="sound-row-title">효과음</span>
          <input type="range" class="sound-slider" id="sfxVolumeSlider" min="0" max="100" value="70">
        </div>
      </div>
      <div class="sound-row">

<script>
/* =========================================================================
   서율 메트로 라이트 - 전기 연결 퍼즐 게임 로직
   ------------------------------------------------------------------------
   - 각 타일은 N/NE/E/SE/S/SW/W/NW 8방향(직선 4방향 + 대각선 4방향) 비트마스크로 연결 상태를 표현
   - 타일을 클릭하면 45도씩 시계방향으로 회전 (비트마스크도 함께 회전, 8방향 원형에서 1칸씩 이동 -> 8단계 모두 사용)
   - 전원역에서 BFS로 연결된 타일을 탐색해 "통전" 여부를 계산 (대각선으로도 전지 가능)
   - 모든 일반역이 통전되면 클리어
========================================================================= */

// ------------------- 방향/비트 상수 -------------------
// 직선 4방향(N/E/S/W)에 대각선 4방향(NE/SE/SW/NW)을 추가해 총 8방향으로 확장.
// 배열 순서가 시계방향 원형을 이뤄야 회전 계산(1칸 이동 = 45도)이 정확히 동작함
const DIRS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
const BIT = { N: 1, NE: 2, E: 4, SE: 8, S: 16, SW: 32, W: 64, NW: 128 };
const OPPOSITE_DIR = {
  N: 'S', S: 'N', E: 'W', W: 'E',
  NE: 'SW', SW: 'NE', SE: 'NW', NW: 'SE',
};
// 각 방향으로 이동했을 때의 (row, col) 변화량 (대각선은 row와 col이 동시에 ±1씩 이동)
const DELTA = {
  N: [-1, 0], NE: [-1, 1], E: [0, 1], SE: [1, 1],
  S: [1, 0], SW: [1, -1], W: [0, -1], NW: [-1, -1],
};

// 45도 시계방향 회전: 8방향 원형에서 각 방향이 1칸씩 시계방향으로 이동 (예: N->NE, NE->E, E->SE ...)
// 클릭 한 번 = 이 함수 한 번 호출 = 45도. 8번 누르면 원래 모양으로 돌아옴(8단계 회전).
function rotateMask45CW(mask) {
  let result = 0;
  DIRS.forEach((dir, i) => {
    if (mask & BIT[dir]) {
      const nextDir = DIRS[(i + 1) % DIRS.length];
      result |= BIT[nextDir];
    }
  });
  return result;
}

// 비트 개수(연결 방향 개수) 세기
function countBits(mask) {
  let c = 0;
  for (let i = 0; i < DIRS.length; i++) if (mask & (1 << i)) c++;
  return c;
}

// ------------------- 스테이지 데이터 -------------------
// edges: [r1,c1,r2,c2] 형태로 "정답 상태"에서 서로 연결된 인접 타일을 나열.
// power: 전원역 좌표 [r,c]  /  stations: 일반역 좌표 배열
// 이 배열에 항목을 추가하면 새로운 스테이지를 쉽게 늘릴 수 있음.
const STAGES = [
  {
    name: '서율 순환선',
    rows: 4, cols: 4,
    power: [0, 0],
    stations: [[2, 3]],
    edges: [
      [0, 0, 0, 1],
      [0, 1, 0, 2],
      [0, 2, 1, 2],
      [1, 2, 2, 2],
      [2, 2, 2, 3],
    ],
  },
  {
    name: '도원 중앙선',
    rows: 4, cols: 4,
    power: [0, 1],
    stations: [[1, 3], [3, 1]],
    edges: [
      [0, 1, 1, 1],
      [1, 1, 1, 2],
      [1, 2, 1, 3],
      [1, 1, 2, 1],
      [2, 1, 3, 1],
    ],
  },
  {
    name: '강림 남부선',
    rows: 5, cols: 5,
    power: [2, 0],
    stations: [[0, 2], [2, 4], [4, 2]],
    edges: [
      [2, 0, 2, 1],
      [2, 1, 2, 2],
      [2, 2, 1, 2],
      [1, 2, 0, 2],
      [2, 2, 2, 3],
      [2, 3, 2, 4],
      [2, 2, 3, 2],
      [3, 2, 4, 2],
    ],
  },
  {
    name: '여울 수변선',
    rows: 5, cols: 5,
    power: [2, 2],
    stations: [[2, 0], [0, 2], [2, 3], [4, 2]],
    edges: [
      [2, 2, 2, 1],
      [2, 1, 2, 0],
      [2, 2, 1, 2],
      [1, 2, 0, 2],
      [1, 2, 1, 3],
      [1, 3, 2, 3],
      [2, 2, 3, 2],
      [3, 2, 4, 2],
    ],
  },
  {
    name: '성류 공업선',
    rows: 5, cols: 5,
    power: [2, 2],
    stations: [[0, 2], [0, 1], [4, 2], [2, 4], [2, 0]],
    edges: [
      [2, 2, 1, 2],
      [1, 2, 0, 2],
      [1, 2, 1, 1],
      [1, 1, 0, 1],
      [2, 2, 3, 2],
      [3, 2, 4, 2],
      [2, 2, 2, 3],
      [2, 3, 2, 4],
      [2, 2, 2, 1],
      [2, 1, 2, 0],
    ],
  },
  {
    // 새로 추가된 "대각선 연결" 스테이지: 전원역을 중심으로 네 모서리 역까지
    // 대각선(NE/SE/SW/NW) 선로만으로 뻗어나가는 X자 모양의 노선.
    // 전원역 타일은 네 대각선 방향이 모두 열린 "대각 교차" 타일이 된다.
    name: '빛가람 대각선',
    rows: 5, cols: 5,
    power: [2, 2],
    stations: [[0, 0], [0, 4], [4, 0], [4, 4]],
    edges: [
      [2, 2, 1, 1], [1, 1, 0, 0], // 좌상단(NW) 방향 대각선 팔
      [2, 2, 1, 3], [1, 3, 0, 4], // 우상단(NE) 방향 대각선 팔
      [2, 2, 3, 1], [3, 1, 4, 0], // 좌하단(SW) 방향 대각선 팔
      [2, 2, 3, 3], [3, 3, 4, 4], // 우하단(SE) 방향 대각선 팔
    ],
  },
  {
    // 신규: "혼합 꺾임" 스테이지. 전원역에서 네 방향으로 뻗어나가되, 각 갈림길 중간에
    // 직선(N/S/E/W)과 대각선(NE/SE/SW/NW)이 한 타일 안에서 섞여 꺾이는 구간을 넣었다.
    // 이런 타일은 90도(4단계)만으로는 절대 맞출 수 없고, 반드시 45도 단위(8단계) 회전이 필요하다.
    name: '노을 갈림선',
    rows: 5, cols: 5,
    power: [2, 2],
    stations: [[0, 3], [4, 0], [4, 3], [2, 0]],
    edges: [
      // 가지 1: 대각선(NE)으로 뻗다가 직선(N)으로 꺾여 역에 도착 -> 꺾이는 타일은 SW+N 혼합
      [2, 2, 1, 3], [1, 3, 0, 3],
      // 가지 2: 대각선(SW)으로 뻗다가 직선(S)->직선(W)로 두 번 꺾여 도착 -> 첫 꺾임은 NE+S 혼합
      [2, 2, 3, 1], [3, 1, 4, 1], [4, 1, 4, 0],
      // 가지 3: 대각선(SE)으로 뻗다가 직선(S)로 꺾여 도착 -> 꺾이는 타일은 NW+S 혼합
      [2, 2, 3, 3], [3, 3, 4, 3],
      // 가지 4: 순수 직선(W) 2칸 -> 기존 4방향 감각과 비교할 수 있는 대조군
      [2, 2, 2, 1], [2, 1, 2, 0],
    ],
  },
];

// 스테이지의 edges에 대각선(dr,dc가 둘 다 ±1) 이동이 하나라도 있으면 "대각선을 쓰는 노선"으로 판단.
// 4방향 모드에서는 이런 노선을 아예 목록에서 빼서, 90도 회전만으로 못 푸는 타일이 나오지 않게 한다.
function stageUsesDiagonal(def) {
  return def.edges.some(([r1, c1, r2, c2]) => Math.abs(r2 - r1) === 1 && Math.abs(c2 - c1) === 1);
}

// ------------------- 절차적 스테이지 생성기 (7번 노선 이후 무한 모드) -------------------
// 수작업 7개 노선을 다 깨면, 그 뒤로는 이 생성기가 매번 새 노선을 즉석에서 만들어 이어준다.
// 생성기는 STAGES의 각 항목과 똑같은 { name, rows, cols, power, stations, edges } 모양만 만들어내므로,
// constructState/buildStageState/computeEnergized 등 기존 로직은 전혀 손대지 않고 그대로 재사용된다.

function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
function choice(arr) { return arr[randInt(0, arr.length - 1)]; }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = randInt(0, i);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const CARDINAL_DIRS = ['N', 'E', 'S', 'W'];
// allowDiagonal=false(4방향 모드)면 대각선을 애초에 후보에서 빼서, 생성 단계에서부터
// 90도 회전만으로 못 맞추는 타일이 나올 수 없게 만든다.
function allowedDirs(allowDiagonal) { return allowDiagonal ? DIRS.slice() : CARDINAL_DIRS.slice(); }

// 한 칸 이동을 시도: 보드 범위 밖이거나 이미 다른 가지가 지나간 칸이면 null.
// 모든 생성기가 이 함수로만 다음 칸을 계산해서, 경계 체크와 "가지끼리 겹치지 않기(사이클 방지)"를
// 한 곳에서 보장한다 (computeEnergized/buildEulerTour가 트리 구조를 가정하기 때문에 중요함).
function tryStep(r, c, dir, rows, cols, occupied) {
  const [dr, dc] = DELTA[dir];
  const nr = r + dr, nc = c + dc;
  if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) return null;
  if (occupied.has(keyOf(nr, nc))) return null;
  return [nr, nc];
}

// 화면 기준 각도(0=E, 시계방향으로 증가)를 가장 가까운 허용 방향으로 변환
const DIR_ANGLE = { E: 0, SE: 45, S: 90, SW: 135, W: 180, NW: 225, N: 270, NE: 315 };
function snapAngleToDir(angleDeg, allowDiagonal) {
  const norm = ((angleDeg % 360) + 360) % 360;
  const dirs = allowedDirs(allowDiagonal);
  let best = dirs[0], bestDiff = Infinity;
  dirs.forEach(d => {
    const diff = Math.min(Math.abs(norm - DIR_ANGLE[d]), 360 - Math.abs(norm - DIR_ANGLE[d]));
    if (diff < bestDiff) { bestDiff = diff; best = d; }
  });
  return best;
}

// 허용된 방향 원형(allowedDirs)에서 한 방향을 steps칸 돌린 방향을 반환 (양수=시계방향)
function rotateDirBy(dir, steps, allowDiagonal) {
  const dirs = allowedDirs(allowDiagonal);
  const idx = dirs.indexOf(dir);
  return dirs[(idx + steps + dirs.length) % dirs.length];
}

// ---- 패턴 1: 방사형 꽃 (기존 수작업 노선의 "전원역 중심으로 팔이 뻗는" 느낌을 일반화) ----
function generateRadialFlower(rows, cols, allowDiagonal) {
  const power = [Math.floor(rows / 2), Math.floor(cols / 2)];
  const occupied = new Set([keyOf(power[0], power[1])]);
  const edges = [];
  const stations = [];
  const armCount = choice([3, 3, 4, 4, 4, 5, 5]);
  const bendProb = allowDiagonal ? 0.5 : 0.35;

  for (let i = 0; i < armCount; i++) {
    const angle = i * (360 / armCount) + randInt(-15, 15);
    let dir = snapAngleToDir(angle, allowDiagonal);
    const armLen = randInt(2, Math.max(2, Math.min(rows, cols) - 2));
    let [r, c] = power;
    let bent = false;
    let moved = false;
    for (let step = 0; step < armLen; step++) {
      let next = tryStep(r, c, dir, rows, cols, occupied);
      if (!next && !bent) {
        // 막히면 한 번은 꺾어서라도 이어가 본다
        for (const s of (allowDiagonal ? [1, -1, 2, -2] : [1, -1])) {
          const altDir = rotateDirBy(dir, s, allowDiagonal);
          const altNext = tryStep(r, c, altDir, rows, cols, occupied);
          if (altNext) { next = altNext; dir = altDir; bent = true; break; }
        }
      } else if (next && !bent && step > 0 && Math.random() < bendProb) {
        // 정상적으로 갈 수 있어도 확률적으로 한 번 꺾는다 (직선+대각선이 섞인 혼합 꺾임 타일을 만들기 위해)
        const altDir = rotateDirBy(dir, choice([1, -1]), allowDiagonal);
        const altNext = tryStep(r, c, altDir, rows, cols, occupied);
        if (altNext) { next = altNext; dir = altDir; bent = true; }
      }
      if (!next) break;
      edges.push([r, c, next[0], next[1]]);
      occupied.add(keyOf(next[0], next[1]));
      r = next[0]; c = next[1];
      moved = true;
    }
    if (moved) stations.push([r, c]);
  }
  return { power, stations, edges };
}

// ---- 패턴 2: 프랙탈 분기 (몸통 2~3개가 중간에서 두 가지로 갈라지는 "나무/코랄" 느낌) ----
function generateFractalBranch(rows, cols, allowDiagonal) {
  const power = [Math.floor(rows / 2), Math.floor(cols / 2)];
  const occupied = new Set([keyOf(power[0], power[1])]);
  const edges = [];
  const stations = [];
  const trunkCount = randInt(2, 3);

  for (let i = 0; i < trunkCount; i++) {
    const angle = i * (360 / trunkCount) + randInt(-20, 20);
    const trunkDir = snapAngleToDir(angle, allowDiagonal);
    const trunkLen = randInt(2, 3);
    let [r, c] = power;
    const path = [[r, c]];
    for (let step = 0; step < trunkLen; step++) {
      const next = tryStep(r, c, trunkDir, rows, cols, occupied);
      if (!next) break;
      edges.push([r, c, next[0], next[1]]);
      occupied.add(keyOf(next[0], next[1]));
      r = next[0]; c = next[1];
      path.push([r, c]);
    }
    if (path.length < 2) continue; // 몸통이 한 칸도 못 뻗었으면 이 가지는 포기

    const doSplit = Math.random() < 0.85;
    if (!doSplit) { stations.push(path[path.length - 1]); continue; }

    const splitIdx = randInt(1, path.length - 1);
    const [sr, sc] = path[splitIdx];
    let anyTwig = false;
    [1, -1].forEach(s => {
      const twigDir = rotateDirBy(trunkDir, s, allowDiagonal);
      let [tr, tc] = [sr, sc];
      const twigLen = randInt(1, 2);
      let moved = false;
      for (let step = 0; step < twigLen; step++) {
        const next = tryStep(tr, tc, twigDir, rows, cols, occupied);
        if (!next) break;
        edges.push([tr, tc, next[0], next[1]]);
        occupied.add(keyOf(next[0], next[1]));
        tr = next[0]; tc = next[1];
        moved = true;
      }
      if (moved) { stations.push([tr, tc]); anyTwig = true; }
    });
    if (!anyTwig) stations.push(path[path.length - 1]);
  }
  return { power, stations, edges };
}

// ---- 패턴 3: 나선형 (전원역에서 바깥으로 소용돌이치듯 뻗어나가는 단일 경로) ----
function generateSpiral(rows, cols, allowDiagonal) {
  const power = [Math.floor(rows / 2), Math.floor(cols / 2)];
  const occupied = new Set([keyOf(power[0], power[1])]);
  const edges = [];
  const path = [power];
  const ring = allowedDirs(allowDiagonal);
  let dirIndex = randInt(0, ring.length - 1);
  let legLength = 1, stepsOnLeg = 0, legsCompleted = 0;
  const maxTotalSteps = randInt(8, 14);
  let [r, c] = power;

  for (let total = 0; total < maxTotalSteps; total++) {
    const dir = ring[dirIndex];
    const next = tryStep(r, c, dir, rows, cols, occupied);
    if (!next) break;
    edges.push([r, c, next[0], next[1]]);
    occupied.add(keyOf(next[0], next[1]));
    r = next[0]; c = next[1];
    path.push([r, c]);
    stepsOnLeg++;
    if (stepsOnLeg >= legLength) {
      // ring이 4방향(90도/칸)이면 1칸=90도 회전, 8방향(45도/칸)이면 2칸=90도 회전이 "표준 직각 회전".
      // 대각선 허용 모드에서는 가끔(30%) 1칸(45도)만 돌아서, 나선이 더 부드럽게 휘도록 함
      const quarterTurn = allowDiagonal ? 2 : 1;
      const turnSteps = (allowDiagonal && Math.random() < 0.3) ? 1 : quarterTurn;
      dirIndex = (dirIndex + turnSteps) % ring.length;
      stepsOnLeg = 0;
      legsCompleted++;
      if (legsCompleted % 2 === 0) legLength++; // 표준 사각 나선처럼 2바퀴마다 다리 길이를 늘림
    }
  }

  if (path.length < 4) return { power, stations: [], edges: [] }; // 너무 일찍 멈추면 실패 처리(디스패처가 재시도)

  const stations = [];
  const stationInterval = randInt(2, 3);
  for (let i = stationInterval; i < path.length; i += stationInterval) stations.push(path[i]);
  const lastCell = path[path.length - 1];
  if (!stations.some(s => s[0] === lastCell[0] && s[1] === lastCell[1])) stations.push(lastCell);
  if (stations.length < 2) stations.push(path[Math.floor(path.length / 2)]);

  return { power, stations, edges };
}

// ---- 패턴 4: 지그재그 격자 (일부러 비대칭으로 왔다갔다 채우는, 다른 3개와 대조되는 미로 느낌) ----
function generateLatticeZigzag(rows, cols, allowDiagonal) {
  const startRow = randInt(0, rows - 1);
  const power = [startRow, 0];
  const occupied = new Set([keyOf(power[0], power[1])]);
  const edges = [];
  const turningPoints = [];
  let [r, c] = power;
  let horizDir = 'E';
  let vertDir = startRow < rows - 1 ? 'S' : 'N';
  const maxSteps = randInt(10, 16);
  let stepsTaken = 0;

  while (stepsTaken < maxSteps) {
    const runLen = randInt(2, Math.max(2, cols - 2));
    let movedInLeg = false;
    for (let i = 0; i < runLen && stepsTaken < maxSteps; i++) {
      const next = tryStep(r, c, horizDir, rows, cols, occupied);
      if (!next) break;
      edges.push([r, c, next[0], next[1]]);
      occupied.add(keyOf(next[0], next[1]));
      r = next[0]; c = next[1];
      stepsTaken++;
      movedInLeg = true;
    }
    if (!movedInLeg) break;
    turningPoints.push([r, c]);

    // 연결 스텝: 보통 세로로 한 칸, 대각선 허용 모드에선 25% 확률로 대각선 한 칸("모서리를 깎은" 느낌)
    const diagonalConnector = allowDiagonal && Math.random() < 0.25;
    function connectorFor(vDir) {
      if (!diagonalConnector) return vDir;
      return horizDir === 'E' ? (vDir === 'S' ? 'SE' : 'NE') : (vDir === 'S' ? 'SW' : 'NW');
    }
    let next = tryStep(r, c, connectorFor(vertDir), rows, cols, occupied);
    if (!next) {
      vertDir = vertDir === 'S' ? 'N' : 'S'; // 더 못 내려가면(또는 못 올라가면) 반대로 뒤집어 재시도
      next = tryStep(r, c, connectorFor(vertDir), rows, cols, occupied);
    }
    if (!next) break;
    edges.push([r, c, next[0], next[1]]);
    occupied.add(keyOf(next[0], next[1]));
    r = next[0]; c = next[1];
    stepsTaken++;
    horizDir = horizDir === 'E' ? 'W' : 'E';
  }

  let stations = turningPoints;
  if (stations.length > 6) stations = stations.filter((_, i) => i % 2 === 0);
  const lastCell = [r, c];
  if (!stations.some(s => s[0] === lastCell[0] && s[1] === lastCell[1])) stations.push(lastCell);
  if (stations.length < 2 && turningPoints.length >= 2) stations = turningPoints.slice(0, 2);

  return { power, stations, edges };
}

// 생성된 노선 하나가 실제로 플레이 가능한 모양인지 검증:
// 역이 2개 이상, 좌표 중복/범위 밖 없음, (4방향 모드면) 대각선 전혀 없음, 사이클 없는 트리,
// 전원역에서 모든 역까지 연결됨.
function isValidStageDef(raw, rows, cols, allowDiagonal) {
  if (!raw || !raw.power || !Array.isArray(raw.stations) || !Array.isArray(raw.edges)) return false;
  if (raw.stations.length < 2) return false;
  const inBounds = ([r, c]) => r >= 0 && r < rows && c >= 0 && c < cols;
  if (!inBounds(raw.power)) return false;
  if (!raw.stations.every(inBounds)) return false;
  if (raw.edges.length === 0) return false;
  if (allowDiagonal === false && stageUsesDiagonal(raw)) return false;

  const powerKey = keyOf(raw.power[0], raw.power[1]);
  const stationKeys = raw.stations.map(([r, c]) => keyOf(r, c));
  if (new Set(stationKeys).size !== stationKeys.length) return false; // 역 좌표 중복
  if (stationKeys.includes(powerKey)) return false; // 역이 전원역과 겹침

  // 트리 검증: edges가 닿는 칸 수 == edges.length + 1 (사이클/중복 간선이 있으면 이 수가 작아짐)
  const cellSet = new Set([powerKey]);
  raw.edges.forEach(([r1, c1, r2, c2]) => { cellSet.add(keyOf(r1, c1)); cellSet.add(keyOf(r2, c2)); });
  if (cellSet.size !== raw.edges.length + 1) return false;

  // 연결성 검증: 전원역에서 BFS로 모든 역에 닿는지 확인
  const adj = {};
  raw.edges.forEach(([r1, c1, r2, c2]) => {
    const a = keyOf(r1, c1), b = keyOf(r2, c2);
    (adj[a] = adj[a] || []).push(b);
    (adj[b] = adj[b] || []).push(a);
  });
  const visited = new Set([powerKey]);
  const queue = [powerKey];
  while (queue.length) {
    const cur = queue.shift();
    (adj[cur] || []).forEach(next => { if (!visited.has(next)) { visited.add(next); queue.push(next); } });
  }
  return stationKeys.every(k => visited.has(k));
}

const STAGE_FAMILIES = [generateRadialFlower, generateFractalBranch, generateSpiral, generateLatticeZigzag];
let familyBag = [];
// "가방 뽑기" 방식: 4개를 섞어서 하나씩 다 뽑을 때까지 반복 뽑지 않음 -> 연속 4판 안에는
// 반드시 4가지 패턴이 한 번씩 다 나오게 되어, 같은 패턴이 계속 반복되는 걸 막는다.
function pickFamily() {
  if (familyBag.length === 0) familyBag = shuffle(STAGE_FAMILIES);
  return familyBag.pop();
}

// 생성 스테이지는 처음 6개까지는 5x5(수작업 노선과 같은 크기), 그 이후부터는 6x6으로 커진다.
function gridSizeForGeneratedIndex(genIndex) { return genIndex < 6 ? 5 : 6; }

const GEN_PLACE_FRAGMENTS = ['한빛', '은파', '청솔', '별내', '소슬', '단풍', '늘봄', '구름', '노리', '미로'];
const GEN_LINE_SUFFIXES = ['순환선', '지선', '연결선', '회랑선', '보선', '외곽선', '심야선', '임시선'];
let recentGenNames = [];
// 수작업 7개 노선 이름과 겹치지 않고, 바로 직전 3개와도 겹치지 않는 이름을 무작위로 조합
function generateStageName() {
  let name;
  do { name = `${choice(GEN_PLACE_FRAGMENTS)} ${choice(GEN_LINE_SUFFIXES)}`; }
  while (recentGenNames.includes(name));
  recentGenNames.push(name);
  if (recentGenNames.length > 3) recentGenNames.shift();
  return name;
}

// 7번 노선 이후 "무한 모드"에서 "다음 노선" 버튼을 누를 때마다 호출되어 노선 하나를 즉석에서 만들어낸다.
function generateStage(genIndex, allowDiagonal) {
  const size = gridSizeForGeneratedIndex(genIndex);
  const family = pickFamily();
  for (let attempt = 0; attempt < 10; attempt++) {
    const raw = family(size, size, allowDiagonal);
    if (isValidStageDef(raw, size, size, allowDiagonal)) {
      return { name: generateStageName(), rows: size, cols: size, power: raw.power, stations: raw.stations, edges: raw.edges };
    }
  }
  // 10번 시도해도 유효한 노선이 안 나오면(매우 드묾), 가장 안정적인 방사형 꽃으로 대체
  const fallback = generateRadialFlower(size, size, allowDiagonal);
  return { name: generateStageName(), rows: size, cols: size, power: fallback.power, stations: fallback.stations, edges: fallback.edges };
}

// ------------------- 상태 생성 -------------------

// 타일이 처음부터 "이미 풀린 상태"로 시작하지 않도록 초기 회전값을 정함.
// baseMask를 1~7번(45도씩) 회전시켜봤을 때 원래 모양(baseMask)과 달라지는 회전값만 후보로 삼고,
// 그 중 하나를 무작위로 고른다. (완전 대칭형이라 1~7 회전 모두 원래와 같아지는 타일은 0을 반환)
// step: 클릭 한 번이 움직이는 45도 단위 칸 수 (8방향 모드=1칸/45도, 4방향 모드=2칸/90도).
// 플레이어가 실제로 누를 수 있는 값(step의 배수)만 후보로 삼아야, 4방향 모드에서
// 홀수(45도) 위치로 시작해 절대 못 맞추는 경우가 생기지 않는다.
function pickInitialRotation(baseMask, step) {
  const candidates = [];
  for (let rot = step; rot <= 7; rot += step) {
    let m = baseMask;
    for (let i = 0; i < rot; i++) m = rotateMask45CW(m);
    if (m !== baseMask) candidates.push(rot);
  }
  if (candidates.length === 0) return 0; // 완전 대칭형: 어떤 회전이든 모양이 같음
  return candidates[Math.floor(Math.random() * candidates.length)];
}

// 좌표 키 생성
function keyOf(r, c) { return r + ',' + c; }

// edges 데이터를 바탕으로 각 타일의 "정답 방향 비트마스크"를 계산하고
// 역할(전원역/일반역/선로)과 랜덤 초기 회전을 부여해 스테이지 상태를 만든다
function constructState(def) {
  const cellMap = {};
  function ensureCell(r, c) {
    const k = keyOf(r, c);
    if (!cellMap[k]) cellMap[k] = { r, c, baseMask: 0, role: 'track' };
    return cellMap[k];
  }

  def.edges.forEach(([r1, c1, r2, c2]) => {
    const a = ensureCell(r1, c1);
    const b = ensureCell(r2, c2);
    const dr = r2 - r1, dc = c2 - c1;
    // DELTA 테이블에서 (dr, dc)와 일치하는 방향을 찾음 (직선 4방향 + 대각선 4방향 모두 지원)
    const dir = DIRS.find(d => DELTA[d][0] === dr && DELTA[d][1] === dc);
    if (!dir) return; // 인접하지 않은 좌표(8방향 밖)는 무시 (데이터 오류 방지)
    a.baseMask |= BIT[dir];
    b.baseMask |= BIT[OPPOSITE_DIR[dir]];
  });

  const [pr, pc] = def.power;
  ensureCell(pr, pc).role = 'power';
  def.stations.forEach(([r, c]) => { ensureCell(r, c).role = 'station'; });

  const cells = Object.values(cellMap);
  cells.forEach(cell => { cell.rotation = pickInitialRotation(cell.baseMask, rotationStep); });

  return {
    name: def.name,
    rows: def.rows,
    cols: def.cols,
    cells,
    powerKey: keyOf(pr, pc),
    cleared: false,
  };
}

// 혹시 랜덤으로 처음부터 전부 연결돼버리는 경우를 막기 위한 안전장치
function buildStageState(def) {
  let state = constructState(def);
  for (let attempt = 0; attempt < 15; attempt++) {
    computeEnergized(state);
    const total = state.cells.filter(c => c.role === 'station').length;
    const lit = state.cells.filter(c => c.role === 'station' && c.energized).length;
    if (lit < total) break; // 아직 풀리지 않은 상태 → 정상
    state = constructState(def); // 다시 랜덤 생성
  }
  return state;
}

// 현재 회전 상태를 반영한 실제 연결 방향 비트마스크
function currentMask(cell) {
  let m = cell.baseMask;
  for (let i = 0; i < cell.rotation; i++) m = rotateMask45CW(m);
  return m;
}

// 전원역에서 BFS로 퍼져나가며 "통전된" 타일을 표시
// parentKey도 함께 기록해두면, 클리어 시 기차가 지나갈 실제 경로(Euler tour)를 만들 수 있음
function computeEnergized(state) {
  const byKey = {};
  state.cells.forEach(c => { byKey[keyOf(c.r, c.c)] = c; c.energized = false; c.parentKey = null; });

  const start = byKey[state.powerKey];
  if (!start) return;
  start.energized = true;
  const queue = [start];

  while (queue.length) {
    const cur = queue.shift();
    const mask = currentMask(cur);
    DIRS.forEach(dir => {
      if (!(mask & BIT[dir])) return;
      const [dr, dc] = DELTA[dir];
      const neighbor = byKey[keyOf(cur.r + dr, cur.c + dc)];
      if (!neighbor || neighbor.energized) return;
      const neighborMask = currentMask(neighbor);
      // 상대 타일도 나를 향한 방향(반대 방향)으로 열려 있어야 실제로 연결됨
      if (neighborMask & BIT[OPPOSITE_DIR[dir]]) {
        neighbor.energized = true;
        neighbor.parentKey = keyOf(cur.r, cur.c);
        queue.push(neighbor);
      }
    });
  }
}

// 통전된 타일들로 이루어진 트리를 깊이우선(Euler tour) 방식으로 순회해,
// 전원역 -> 모든 연결된 선로/역을 빠짐없이 지나가며 분기점으로 되돌아오는 좌표 순서를 만든다.
// 인접한 칸끼리만 이동하므로, 기차가 실제로 복구된 선로 위만 밟고 지나가게 된다.
function buildEulerTour(state) {
  const byKey = {};
  state.cells.forEach(c => { byKey[keyOf(c.r, c.c)] = c; });

  // 부모 -> 자식들 매핑 생성 (BFS 트리 구조)
  const childrenMap = {};
  state.cells.forEach(c => {
    if (c.energized && c.parentKey) {
      if (!childrenMap[c.parentKey]) childrenMap[c.parentKey] = [];
      childrenMap[c.parentKey].push(c);
    }
  });

  const tour = [];
  function visit(cell) {
    tour.push(cell);
    const children = childrenMap[keyOf(cell.r, cell.c)] || [];
    children.forEach(child => {
      visit(child);
      tour.push(cell); // 자식 쪽 지선을 다 지나면 분기점으로 되돌아옴
    });
  }

  const root = byKey[state.powerKey];
  if (root) visit(root);
  return tour;
}

// rotationStep: 클릭 한 번의 회전 단위(45도 칸 수). 4방향 모드=2(90도), 8방향 모드=1(45도).
// activeStages: 선택한 모드로 플레이할 노선 목록. 4방향 모드는 대각선을 쓰는 노선을 제외한다.
// curatedCount: activeStages 안에서 수작업 노선이 몇 개인지(모드별로 필터링된 뒤의 길이).
// generatedCount: 지금까지 즉석에서 만들어낸 노선 수. milestoneShown: "모든 노선 복구 완료" 배너를 이미 보여줬는지.
let rotationStep = 1;
let activeStages = STAGES;
let curatedCount = STAGES.length;
let generatedCount = 0;
let milestoneShown = false;
let currentStageIndex = 0;
let currentState = null;
let trainAnimation = null; // 진행 중인 기차 애니메이션(Web Animations API) 참조

// 현재 모드(rotationStep)에 맞는 수작업 노선 목록으로 activeStages를 되돌리고,
// 무한 모드 관련 상태(생성 개수, 배너 표시 여부)도 초기화한다.
function resetActiveStagesToCurated() {
  // .slice()로 항상 새 배열을 만든다 — 그냥 STAGES를 대입하면 같은 배열을 가리키게 되어,
  // 무한 모드에서 activeStages.push(...)를 할 때 수작업 STAGES 배열 자체가 오염된다.
  activeStages = rotationStep === 2 ? STAGES.filter(def => !stageUsesDiagonal(def)) : STAGES.slice();
  curatedCount = activeStages.length;
  generatedCount = 0;
  milestoneShown = false;
}

// 타일 회전 CSS transition(0.22s)과 동일하게 맞춘 지연 시간.
// 클릭 즉시가 아니라, 회전이 "딱" 끝나서 선로가 맞물리는 순간에만 통전 판정 + 전기음이 울리게 함.
const TILE_ROTATE_MS = 230;

/* =========================================================================
   오디오 - 외부 음원 파일 없이 Web Audio API로 모든 소리를 직접 합성
   - SFX: 타일 회전 "틱", 역 연결 "팅" 벨 사운드, 클리어 팡파레
   - BGM: Am-F-C-G 코드 진행을 오가는 베이스 + 오르내리는 아르페지오 +
     은은한 킥 펄스로 구성된, 단조롭지 않게 움직이는 네온 나이트 루프
   - 효과음(sfxBus)과 배경음악(musicBus)은 서로 독립된 마스터 게인을 가져서
     각각 음소거 / 볼륨을 따로 조절할 수 있다.
========================================================================= */
let audioCtx = null;
let sfxBus = null;   // 효과음 전용 마스터 게인
let musicBus = null; // 배경음악 전용 마스터 게인
let musicNodes = null;      // 현재 재생 중인 배경음악 버퍼 소스

// 효과음/배경음악 각각의 "슬라이더 볼륨(0~1)"과 "음소거 여부"를 따로 관리
const sfxState = { volume: 0.7, muted: false };
const musicState = { volume: 0.4, muted: false };
const MUSIC_MAX_GAIN = 0.28; // 배경음악 슬라이더 100%일 때의 실제 최대 볼륨 (효과음보다 작게)

function getAudioCtx() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function ensureAudioBuses(ctx) {
  if (!sfxBus) {
    sfxBus = ctx.createGain();
    sfxBus.gain.value = sfxState.muted ? 0 : sfxState.volume;
    sfxBus.connect(ctx.destination);
  }
  if (!musicBus) {
    musicBus = ctx.createGain();
    musicBus.gain.value = musicState.muted ? 0 : musicState.volume * MUSIC_MAX_GAIN;
    musicBus.connect(ctx.destination);
  }
}

// 효과음 버스의 실제 볼륨을 현재 슬라이더 값 + 음소거 상태에 맞춰 갱신
function applySfxGain() {
  if (sfxBus) sfxBus.gain.value = sfxState.muted ? 0 : sfxState.volume;
}

// 배경음악 버스의 실제 볼륨을 현재 슬라이더 값 + 음소거 상태에 맞춰 갱신
function applyMusicGain() {
  if (musicBus) musicBus.gain.value = musicState.muted ? 0 : musicState.volume * MUSIC_MAX_GAIN;
}

// 상단 스피커 아이콘은 "효과음과 배경음악 둘 다 꺼져 있는지"를 보여준다
function refreshMasterIcon() {
  const allMuted = sfxState.muted && musicState.muted;
  soundToggleBtn.textContent = allMuted ? '🔇' : '🔊';
  soundToggleBtn.classList.toggle('muted', allMuted);
}

// ------------------- 실제 음원 파일 로딩 (전부 CC0 — 라이선스는 assets/CREDITS.txt 참고) -------------------
// 합성 대신 짧은 CC0 오디오 파일을 미리 디코딩해두고, 재생할 때는 버퍼를 그대로 튼다.
// 디코딩은 사용자 제스처 없이도 가능해서 페이지가 열리자마자 미리 불러와 둔다 (첫 클릭 전에 준비 완료).
const AUDIO_FILES = {
  rotate: 'assets/sfx/rotate.ogg',
  trackConnect: 'assets/sfx/track-connect.ogg',
  stationConnect: 'assets/sfx/station-connect.ogg',
  clear: 'assets/sfx/clear.ogg',
  bgm: 'assets/music/bgm.ogg',
};
const audioBuffers = {};

function preloadAudio() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  Object.entries(AUDIO_FILES).forEach(([key, url]) => {
    fetch(url)
      .then(res => res.arrayBuffer())
      .then(data => ctx.decodeAudioData(data))
      .then(decoded => { audioBuffers[key] = decoded; })
      .catch(() => {
        // 파일을 못 불러와도(네트워크 실패 등) 게임 진행에는 영향 없음 - 해당 사운드만 조용히 재생 안 됨
      });
  });
}

// 로딩된 버퍼 하나를 지정된 버스로 재생. volume: 0~1, playbackRate: 피치(1=원본), delay: 시작 지연(초)
function playBuffer(bus, buffer, { volume, playbackRate, delay } = {}) {
  const ctx = getAudioCtx();
  if (!ctx || !buffer) return; // 아직 로딩 중이면 조용히 무시 (게임 진행에는 영향 없음)
  ensureAudioBuses(ctx);
  try {
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    if (playbackRate != null) src.playbackRate.value = playbackRate;
    const gain = ctx.createGain();
    gain.gain.value = volume != null ? volume : 1;
    src.connect(gain);
    gain.connect(bus);
    src.start(ctx.currentTime + (delay || 0));
    return src;
  } catch (e) {
    // 오디오 재생 실패해도 게임 진행에는 영향 없음
  }
}

// 타일을 회전할 때 나는 짧고 또렷한 클릭음
function playRotateSound() {
  playBuffer(sfxBus, audioBuffers.rotate, { volume: 0.9 });
}

// 선로 조각 하나가 막 연결되는 순간의 가벼운 틱 - 역이 켜질 때보다 짧고 가볍게,
// 선로가 하나하나 이어질 때마다 또렷한 타격감만 남긴다
// order: 같은 턴에 여러 선로가 동시에 연결되면 순서대로 피치를 살짝 높여 또르르 이어지는 느낌을 줌
function playTrackConnectSound(order) {
  const n = order || 0;
  playBuffer(sfxBus, audioBuffers.trackConnect, { volume: 0.9, playbackRate: Math.pow(1.05, n), delay: n * 0.02 });
}

// 선로가 "딱" 맞물려 역에 전기가 들어오는 순간 재생되는, 더 또렷하고 풍성한 확인음
// order: 같은 턴에 여러 역이 동시에 켜질 경우 순서대로 피치를 살짝 높여 화음처럼 들리게 함
function playConnectSound(order) {
  const n = order || 0;
  playBuffer(sfxBus, audioBuffers.stationConnect, { volume: 1, playbackRate: Math.pow(1.05, n), delay: n * 0.05 });
}

// 스테이지를 모두 복구했을 때 재생되는 승리 사운드
function playClearFanfare() {
  playBuffer(sfxBus, audioBuffers.clear, { volume: 1 });
}

// ------------------- 배경음악 -------------------
// "신비한 터널을 질주하는 하이퍼 기차" 느낌의 CC0 루프 파일을 그대로 반복 재생한다.
function startBackgroundMusic() {
  const ctx = getAudioCtx();
  if (!ctx || musicNodes) return; // 오디오 미지원 또는 이미 재생 중이면 무시
  const buffer = audioBuffers.bgm;
  if (!buffer) return; // 아직 로딩 중이면 무시 (볼륨 조절 등으로 다시 호출되면 그때 재생됨)
  ensureAudioBuses(ctx);
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  src.loop = true;
  src.connect(musicBus);
  src.start();
  musicNodes = { src };
}

function stopBackgroundMusic() {
  if (musicNodes) {
    try { musicNodes.src.stop(); } catch (e) {}
    musicNodes = null;
  }
}

// ------------------- 효과음 / 배경음악 개별 조절 UI -------------------

// 효과음 음소거 토글
function setSfxMuted(muted) {
  sfxState.muted = muted;
  applySfxGain();
  sfxMuteBtn.textContent = muted ? '🔕' : '🔔';
  sfxMuteBtn.classList.toggle('muted', muted);
  refreshMasterIcon();
}

// 배경음악 음소거 토글
function setMusicMuted(muted) {
  musicState.muted = muted;
  applyMusicGain();
  musicMuteBtn.textContent = muted ? '🎵' : '🎵';
  musicMuteBtn.classList.toggle('muted', muted);
  refreshMasterIcon();
  // 음소거를 풀고 배경음악이 아직 시작 전이면(오디오가 이미 깨어있는 상태) 바로 재생 시작
  if (!muted) startBackgroundMusic();
}

sfxMuteBtn.addEventListener('click', () => setSfxMuted(!sfxState.muted));
musicMuteBtn.addEventListener('click', () => setMusicMuted(!musicState.muted));

// 슬라이더로 효과음 볼륨 조절 (0~100 -> 0~1)
sfxVolumeSlider.addEventListener('input', () => {
  sfxState.volume = Number(sfxVolumeSlider.value) / 100;
  if (sfxState.muted && sfxState.volume > 0) setSfxMuted(false); // 볼륨을 올리면 자동으로 음소거 해제
  applySfxGain();
  playRotateSound(); // 슬라이더를 움직이는 즉시 현재 볼륨을 미리 들어볼 수 있게 샘플 사운드 재생
});

// 슬라이더로 배경음악 볼륨 조절 (0~100 -> 0~1)
musicVolumeSlider.addEventListener('input', () => {
  musicState.volume = Number(musicVolumeSlider.value) / 100;
  if (musicState.muted && musicState.volume > 0) setMusicMuted(false); // 볼륨을 올리면 자동으로 음소거 해제
  applyMusicGain();
  startBackgroundMusic(); // 아직 시작 전이었다면 음악을 켜줌
});

// 상단 스피커 아이콘 클릭 -> 조절 패널 펼치기/접기
soundToggleBtn.addEventListener('click', () => {
  soundPanel.classList.toggle('hidden');
});

// 패널 바깥(보드, 버튼 등)을 클릭하면 패널을 자동으로 닫음
document.addEventListener('pointerdown', (e) => {
  if (!soundPanel.classList.contains('hidden') &&
      !e.target.closest('.sound-panel-wrap')) {
    soundPanel.classList.add('hidden');
  }
});

// 브라우저는 사용자 제스처 전까지 오디오 재생을 막으므로,
// 화면을 처음 터치/클릭하는 순간 오디오 컨텍스트를 깨우고 배경음악을 시작한다.
function unlockAudioOnFirstInteraction() {
  const ctx = getAudioCtx();
  if (ctx) {
    ensureAudioBuses(ctx);
    if (!musicState.muted) startBackgroundMusic();
  }
  document.removeEventListener('pointerdown', unlockAudioOnFirstInteraction);
}
document.addEventListener('pointerdown', unlockAudioOnFirstInteraction, { once: true });

// 타일 DOM 요소를 한 번 생성 (바 + 중심점 + 아이콘)
function createTileElement(cell) {
  const tile = document.createElement('div');
  tile.className = 'tile role-' + cell.role;

  const track = document.createElement('div');
  track.className = 'tile-track';
  DIRS.forEach(dir => {
    if (cell.baseMask & BIT[dir]) {
      const bar = document.createElement('span');
      bar.className = 'bar bar-' + dir;
      track.appendChild(bar);
    }
  });
  const center = document.createElement('span');
  center.className = 'tile-center';
  track.appendChild(center);
  tile.appendChild(track);

  // 아이콘은 회전하지 않는 별도 레이어 (항상 바로 서 있음)
  if (cell.role === 'power') {
    const icon = document.createElement('span');
    icon.className = 'tile-icon icon-power';
    icon.textContent = '⚡';
    tile.appendChild(icon);
  } else if (cell.role === 'station') {
    const icon = document.createElement('span');
    icon.className = 'tile-icon icon-station';
    const dot = document.createElement('span');
    dot.className = 'station-dot';
    icon.appendChild(dot);
    tile.appendChild(icon);
  }

  tile.addEventListener('click', () => onTileClick(cell));

  cell._tileEl = tile;
  cell._trackEl = track;
  return tile;
}

// 보드 전체를 새로 그림 (스테이지 전환 시)
function renderBoard(state) {
  boardEl.innerHTML = '';
  boardEl.style.gridTemplateColumns = `repeat(${state.cols}, 1fr)`;
  boardEl.style.gridTemplateRows = `repeat(${state.rows}, 1fr)`;

  const byKey = {};
  state.cells.forEach(c => { byKey[keyOf(c.r, c.c)] = c; });

  for (let r = 0; r < state.rows; r++) {
    for (let c = 0; c < state.cols; c++) {
      const cell = byKey[keyOf(r, c)];
      if (cell) {
        boardEl.appendChild(createTileElement(cell));
      } else {
        const empty = document.createElement('div');
        empty.className = 'cell-empty';
        boardEl.appendChild(empty);
      }
    }
  }
}

// 타일 중심에서 사방으로 스파크 파티클이 튀는 "연결 버스트" 이펙트를 생성
// (링 하나 + 작은 스파크 점 여러 개를 DOM으로 만들어 CSS 애니메이션으로 재생 후 제거)
function spawnConnectBurst(tileEl) {
  const burst = document.createElement('div');
  burst.className = 'connect-burst';

  const ring = document.createElement('span');
  ring.className = 'burst-ring';
  burst.appendChild(ring);

  const sparkCount = 7;
  for (let i = 0; i < sparkCount; i++) {
    const angle = (Math.PI * 2 * i) / sparkCount + (Math.random() - 0.5) * 0.4;
    const dist = 32 + Math.random() * 14; // 더 커진 링 반경(43px)에 맞춰 더 멀리 튀도록
    const spark = document.createElement('span');
    spark.className = 'burst-spark';
    spark.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
    spark.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
    burst.appendChild(spark);
  }

  tileEl.appendChild(burst);
  setTimeout(() => burst.remove(), 480);
}

// 타일에 "처음 전기가 들어온 순간" 번쩍이는 플래시 + (역이면) 버스트 파티클을 재생
function playConnectVisualEffect(cell) {
  const el = cell._tileEl;
  el.classList.remove('spark-flash');
  void el.offsetWidth; // 리플로우 강제 -> 애니메이션 재시작 가능하게 함
  el.classList.add('spark-flash');
  setTimeout(() => el.classList.remove('spark-flash'), 520);
  spawnConnectBurst(el);
}

// 타일들의 시각 상태(회전/통전 색상)를 갱신하고 통전 역 개수를 반환
// newlyEnergized: 이번 클릭으로 "방금 막" 통전된 선로/역 전체 목록 (타일 하나하나 연결될 때마다 나는 사운드에 사용)
// newlyLit: 그중 "역"만 모은 목록 (별도의 더 풍성한 완성 사운드 + 팝 애니메이션에 사용)
// silent: true면 이펙트/사운드 트리거용 목록을 계산하지 않고 상태만 조용히 맞춰둠
//         (스테이지를 처음 불러올 때, 우연히 이미 연결된 타일에서 이펙트가 터지는 것을 방지)
function refreshVisuals(state, silent) {
  computeEnergized(state);
  let lit = 0, total = 0;
  const newlyEnergized = [];
  const newlyLit = [];

  state.cells.forEach(cell => {
    cell._trackEl.style.transform = `rotate(${cell.rotation * 45}deg)`;
    const wasEnergized = cell._wasEnergized;
    cell._tileEl.classList.toggle('energized', cell.energized);

    // 선로/일반역이 "방금 처음 통전된 순간"이면 스파크 이펙트를 터뜨리고 사운드 대상에 추가
    if (!silent && cell.energized && !wasEnergized && cell.role !== 'power') {
      playConnectVisualEffect(cell);
      newlyEnergized.push(cell);
    }
    cell._wasEnergized = cell.energized;

    if (cell.role === 'station') {
      total++;
      if (cell.energized) lit++;
      const wasLit = cell._wasLit;
      cell._tileEl.classList.toggle('lit', cell.energized);
      if (!silent && cell.energized && !wasLit) {
        // 방금 막 불이 켜진 순간 -> 반짝 애니메이션 + 더 풍성한 완성 사운드 대상에 추가
        cell._tileEl.classList.add('pop');
        setTimeout(() => cell._tileEl.classList.remove('pop'), 500);
        newlyLit.push(cell);
      }
      cell._wasLit = cell.energized;
    }
  });

  return { lit, total, newlyEnergized, newlyLit };
}

let pendingSettleTimer = null; // "회전이 막 끝나는 순간" 통전 판정을 예약해두는 전역 타이머

// 타일 클릭 -> rotationStep만큼 회전 -> (회전이 끝난 뒤) 통전 재계산
// 8방향 모드(rotationStep=1)는 45도씩, 4방향 모드(rotationStep=2)는 90도씩 돈다.
// 회전 모션은 즉시 보여주고, "전기가 들어오는 판정 + 전기음"은 선로가 실제로
// 맞물리는 시점(CSS 회전 애니메이션이 끝나는 순간)에 맞춰 지연 실행한다.
function onTileClick(cell) {
  if (currentState.cleared) return; // 클리어 후에는 회전 불가
  cell.rotation = (cell.rotation + rotationStep) % 8;
  playRotateSound(); // 회전 시작 시 짧은 틱 사운드
  cell._trackEl.style.transform = `rotate(${cell.rotation * 45}deg)`; // 회전 모션 즉시 재생

  // 여러 타일을 연속으로 눌러도, 마지막 회전이 멈춘 뒤 한 번만 통전 판정 + 사운드가 울리게 디바운스
  clearTimeout(pendingSettleTimer);
  pendingSettleTimer = setTimeout(updateAfterMove, TILE_ROTATE_MS);
}

// 회전 후 상태 메시지/클리어 여부 갱신
function updateAfterMove() {
  const { lit, total, newlyEnergized, newlyLit } = refreshVisuals(currentState);

  // 선로 조각이 하나하나 연결될 때마다(역은 아래에서 별도로 처리) 가벼운 스파크 틱을 순서대로 재생
  const newlyLitSet = new Set(newlyLit);
  const newlyTracks = newlyEnergized.filter(cell => !newlyLitSet.has(cell));
  newlyTracks.forEach((cell, i) => playTrackConnectSound(i));

  // 방금 새로 연결된 역이 있으면 역마다 "핑" 전기음을 순서대로 재생
  newlyLit.forEach((cell, i) => playConnectSound(i));

  if (currentState.cleared) return;

  if (lit === 0) {
    statusEl.textContent = '노선을 복구하세요';
  } else if (lit < total) {
    statusEl.textContent = `${lit}개 역 복구됨 (총 ${total}개)`;
  }

  if (total > 0 && lit === total) {
    // 클리어!
    currentState.cleared = true;
    statusEl.textContent = `${currentState.name} 복구 완료!`;
    playClearFanfare();
    playTrainAnimation();
    boardEl.querySelectorAll('.tile').forEach(t => t.classList.add('cleared'));

    // 수작업 노선을 처음 다 깨는 순간에만 "모든 노선 복구 완료" 배너를 한 번 보여주고,
    // 그 뒤로는 무한 모드로 이어지니 nextBtn이 계속 "다음 노선"을 생성해서 보여준다.
    if (currentStageIndex === curatedCount - 1 && !milestoneShown) {
      milestoneShown = true;
      nextBtn.classList.add('hidden');
      allClearBanner.classList.remove('hidden');
    } else {
      nextBtn.classList.remove('hidden');
    }
  }
}

// 클리어 시 작은 기차가 "실제로 복구된 노선" 위를 따라 처음부터 끝까지 지나가는 애니메이션
function playTrainAnimation() {
  const tour = buildEulerTour(currentState); // 전원역에서 시작해 모든 선로를 지나는 좌표 순서
  if (tour.length === 0) return;

  // 각 셀의 중심 좌표(보드 래퍼 기준 px)를 계산
  const wrapRect = boardWrap.getBoundingClientRect();
  const boardRect = boardEl.getBoundingClientRect();
  const cellW = boardRect.width / currentState.cols;
  const cellH = boardRect.height / currentState.rows;
  const offsetX = boardRect.left - wrapRect.left;
  const offsetY = boardRect.top - wrapRect.top;

  const points = tour.map(cell => ({
    x: offsetX + cellW * (cell.c + 0.5),
    y: offsetY + cellH * (cell.r + 0.5),
  }));

  // 기차 아이콘을 시작점에 배치하고 보이게 전환
  trainSprite.style.transform = `translate(${points[0].x}px, ${points[0].y}px) translate(-50%, -50%)`;
  trainSprite.classList.add('run');

  // 이전에 실행 중이던 애니메이션이 있다면 취소
  if (trainAnimation) trainAnimation.cancel();

  // Web Animations API 키프레임으로 경로 순서를 그대로 따라가게 함
  const totalSteps = points.length - 1;
  const stepDuration = 260; // 한 칸 이동에 걸리는 시간(ms) - 전체 속도 조절용
  const keyframes = points.map((p, i) => ({
    transform: `translate(${p.x}px, ${p.y}px) translate(-50%, -50%)`,
    offset: totalSteps > 0 ? i / totalSteps : 0,
  }));

  trainAnimation = trainSprite.animate(keyframes, {
    duration: Math.max(900, stepDuration * totalSteps),
    easing: 'linear',
    iterations: 1,
    fill: 'forwards',
  });

  trainAnimation.onfinish = () => {
    // 경로 끝까지 다 지나가면 서서히 사라짐
    trainSprite.classList.remove('run');
  };
}

// ------------------- 스테이지 로드 / 버튼 처리 -------------------

// 노선마다 살짝 다른 "터널 색" 배경 테마로 순환시켜, 매 스테이지가 조금씩 다른 분위기의
// 터널을 달리는 느낌을 준다. 선로/통전 색(민트-시안)은 모든 테마에서 동일하게 유지해 가독성은 그대로 둔다.
const BG_THEMES = [
  { bg1:'#05060f', bg2:'#0a0e24', bg3:'#121a3a', halo:'rgba(77,170,220,0.3)' },   // 서율: 전기 블루
  { bg1:'#0a0612', bg2:'#150a2e', bg3:'#241240', halo:'rgba(150,100,220,0.28)' }, // 도원: 미스터리 바이올렛
  { bg1:'#050f0e', bg2:'#0a1f1c', bg3:'#113830', halo:'rgba(60,210,180,0.28)' },  // 강림: 전기 틸
  { bg1:'#05081a', bg2:'#0a1230', bg3:'#12204a', halo:'rgba(70,140,230,0.3)' },   // 여울: 인디고 블루
  { bg1:'#120a05', bg2:'#241508', bg3:'#3a220c', halo:'rgba(230,150,60,0.25)' },  // 성류: 호박색 전류
  { bg1:'#140a1a', bg2:'#260f30', bg3:'#3a1848', halo:'rgba(220,90,220,0.25)' },  // 빛가람: 전기 마젠타
  { bg1:'#16090d', bg2:'#2a1018', bg3:'#3e1a22', halo:'rgba(230,110,110,0.25)' }, // 노을: 로즈 앰버
];
function applyBgTheme(index) {
  const theme = BG_THEMES[index % BG_THEMES.length];
  const root = document.documentElement.style;
  root.setProperty('--bg-deep1', theme.bg1);
  root.setProperty('--bg-deep2', theme.bg2);
  root.setProperty('--bg-deep3', theme.bg3);
  root.setProperty('--bg-halo', theme.halo);
}

function loadStage(index) {
  currentStageIndex = index;
  applyBgTheme(index);
  const def = activeStages[index];
  currentState = buildStageState(def);

  // 수작업 노선은 "3/7"처럼 전체 개수를 보여주고, 그 뒤 무한 모드 노선은 끝이 없으니
  // "N번째 노선 · 무한모드"처럼 번호만 보여준다.
  stageBadgeEl.textContent = index < curatedCount
    ? `${index + 1}/${curatedCount}`
    : `${index + 1}번째 노선 · 무한모드`;
  stageNameEl.textContent = def.name;
  statusEl.textContent = '노선을 복구하세요';
  nextBtn.classList.add('hidden');
  allClearBanner.classList.add('hidden');
  if (trainAnimation) { trainAnimation.cancel(); trainAnimation = null; }
  trainSprite.classList.remove('run');

  renderBoard(currentState);
  refreshVisuals(currentState, true); // 초기 배치 상태를 조용히 반영 (이펙트/사운드 없이)
}

nextBtn.addEventListener('click', () => {
  const nextIndex = currentStageIndex + 1;
  if (nextIndex >= activeStages.length) {
    // 수작업 노선이 끝났으면, "다음 노선"을 누르는 순간 새 노선을 즉석에서 만들어 이어붙인다.
    activeStages.push(generateStage(generatedCount, rotationStep === 2));
    generatedCount++;
  }
  loadStage(nextIndex);
});

restartBtn.addEventListener('click', () => {
  resetActiveStagesToCurated(); // 무한 모드 중에 재시작해도 생성된 노선이 남아있지 않게 초기화
  loadStage(0);
});

// ------------------- 모드(난이도) 선택 -> 선택한 모드에 맞춰 노선 목록/회전 단위를 정하고 게임 시작 -------------------
function startWithMode(step) {
  rotationStep = step;
  resetActiveStagesToCurated();
  modeSelectOverlay.classList.add('hidden');
  loadStage(0);
}
mode4Btn.addEventListener('click', () => startWithMode(2));
mode8Btn.addEventListener('click', () => startWithMode(1));

// ------------------- 게임 시작 -------------------
refreshMasterIcon();
preloadAudio(); // 첫 클릭 전에 미리 디코딩해둬서, 실제로 소리가 필요한 시점엔 바로 재생되게 함
</script>
</body>
</html>
